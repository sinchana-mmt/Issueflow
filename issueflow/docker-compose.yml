services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    image: issueflow:local
    pull_policy: never
    env_file: .env
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx scripts/bootstrap.ts"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    image: issueflow:local
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - attachments:/data/attachments
      - backups:/data/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 25s
    restart: unless-stopped

  worker:
    image: issueflow:local
    pull_policy: never
    env_file: .env
    command: ["npx", "tsx", "src/worker/index.ts"]
    volumes:
      - attachments:/data/attachments
      - backups:/data/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  attachments:
  backups:
